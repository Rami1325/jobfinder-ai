name: CI

on:
  push:
  pull_request:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # NO RETRY. There used to be a `|| python -m tests.smoke_test` here, for a
      # single check ("default master is the most recently updated") that flaked
      # on same-second updated_at ordering. That flake was FIXED at the point of
      # writing (routes.py stamps updated_at one microsecond past the newest row
      # for the user), so the retry outlived its cause and became a liability:
      # smoke_test.py is straight-line top-level code with no top-level try, so
      # an exception at check 50 aborts the process and checks 51-915 never run.
      # Under `A || A` a nondeterministic crash therefore produced a GREEN build
      # with ~865 checks silently unexecuted. A red run is real — do not re-run
      # it away, diagnose it.
      - name: Offline smoke test (stub LLM)
        run: python -m tests.smoke_test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check + build
        run: npm run build
