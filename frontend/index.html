<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1420" />
    <script>
      // Set the theme class before first paint to avoid a flash of the wrong
      // theme. localStorage.theme ("light" | "dark") wins; otherwise follow
      // the system preference. Kept in sync at runtime by src/hooks/useTheme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.classList.add(theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f6f4ef" : "#0f1420");
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>JobFinder — AI Resume Tailoring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
