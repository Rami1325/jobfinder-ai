<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1420" />
    <script>
      // Set the theme class before first paint to avoid a flash of the wrong
      // theme. localStorage.theme ("light" | "dark") wins; otherwise follow
      // the system preference. Kept in sync at runtime by src/hooks/useTheme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.classList.add(theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f6f4ef" : "#0f1420");

        // Same no-flash treatment for language direction: Hebrew is RTL and a
        // LTR->RTL relayout after hydration is jarring. src/i18n.ts keeps these
        // attributes (and the "lang" localStorage key) in sync at runtime.
        var lang = null;
        try {
          lang = localStorage.getItem("lang");
        } catch (e) {}
        if (!lang) lang = (navigator.language || "en").split("-")[0];
        lang = lang.indexOf("he") === 0 ? "he" : "en";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>JobFinder — AI Resume Tailoring</title>
    <meta
      name="description"
      content="AI résumé tailoring and multi-board job search for the Israeli market, with a fabrication guard that keeps every edit truthful."
    />
    <meta property="og:title" content="JobFinder — AI Resume Tailoring" />
    <meta
      property="og:description"
      content="AI résumé tailoring and multi-board job search for the Israeli market, with a fabrication guard that keeps every edit truthful."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jobfinder-hazel-pi.vercel.app/" />
    <meta property="og:site_name" content="JobFinder" />
    <meta property="og:image" content="https://jobfinder-hazel-pi.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jobfinder-hazel-pi.vercel.app/og.png" />
    <link rel="canonical" href="https://jobfinder-hazel-pi.vercel.app/" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
